version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: wallet_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet_db
    ports:
      - '3306:3306'

  redis:
    image: redis:7
    container_name: wallet_redis
    restart: always
    ports:
      - '6379:6379'